name: Python CI

# 1. Trigger: run on push or pull request
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 2. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 3. Set up Python
      - name: Set up Node.js
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # 4. Install dependencies
      - name: Install dependencies
        run: pip install pytest

      # 5. Run tests
      - name: Run tests
        run: pytest
